# Local Elastic stack to develop against, plus the self-managed connector
# service. Everything here runs on the free Basic licence.
#
#   docker compose up -d setup elasticsearch kibana
#   # provision through the Probe UI, then paste the API key into
#   # connectors-config/config.yml
#   docker compose up -d connectors
#
# Kibana takes a couple of minutes on a cold start. Watch it with:
#   docker compose logs -f kibana

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.1
    container_name: probe-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-probe-dev-es-passw0rd}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u elastic:${ELASTIC_PASSWORD:-probe-dev-es-passw0rd} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - es-data:/usr/share/elasticsearch/data

  # ELASTIC_PASSWORD only sets the `elastic` superuser. Kibana logs in as the
  # built-in `kibana_system` user, whose password has to be set through the
  # API — without this, Kibana fails to authenticate and never starts.
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.1
    container_name: probe-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c '
        echo "Setting the kibana_system password...";
        until curl -sf -u "elastic:${ELASTIC_PASSWORD:-probe-dev-es-passw0rd}"
          -X POST http://elasticsearch:9200/_security/user/kibana_system/_password
          -H "Content-Type: application/json"
          -d "{\"password\":\"${KIBANA_SYSTEM_PASSWORD:-probe-dev-kibana-passw0rd}\"}"; do
          sleep 5;
        done;
        echo "";
        echo "Done. Kibana can start now.";
      '

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.1
    container_name: probe-kibana
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-probe-dev-kibana-passw0rd}
      # Kibana needs a key of at least 32 characters to encrypt action
      # connector secrets. Without it, connectors cannot be saved.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-probe_dev_kibana_encryption_key_32}
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q available"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  # The self-managed Jira content connector. It reads config.yml for the
  # connector id and API key that Probe's provisioning step generates, so start
  # it only after provisioning once.
  connectors:
    image: docker.elastic.co/integrations/elastic-connectors:9.0.1
    container_name: probe-connectors
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: /app/bin/elastic-ingest -c /config/config.yml
    volumes:
      - ./connectors-config:/config
    restart: unless-stopped

volumes:
  es-data:
